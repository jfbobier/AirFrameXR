<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AirFrameXR: neural frame generation explained (source of airframexr-neural-fg.png; render: rsvg-convert -z 1.25). Facts: docs/FRAME_GENERATION.md, docs/NEURAL_RIFE_CUDA.md, docs/releases/v1.4.2.md -->
  <defs>
    <radialGradient id="bg" cx="70%" cy="20%" r="90%">
      <stop offset="0" stop-color="#0d1a33"/>
      <stop offset="0.55" stop-color="#080e1d"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0c1320"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2142"/>
      <stop offset="1" stop-color="#0a1528"/>
    </linearGradient>
    <linearGradient id="net" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6fff"/>
      <stop offset="1" stop-color="#18b6ff"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22355e"/>
      <stop offset="1" stop-color="#121c33"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3aa0ff"/>
    </marker>
    <!-- a small scene: a pole in front of hills, a ball moving left to right behind... in front of the pole -->
    <g id="scene">
      <rect x="0" y="0" width="200" height="118" rx="8" fill="url(#sky)"/>
      <path d="M0,92 C40,72 70,80 100,70 C130,60 160,74 200,66 L200,118 L0,118 z" fill="#1b2a47"/>
      <rect x="120" y="24" width="12" height="94" fill="#5b6b8c"/>
      <rect x="0" y="0" width="200" height="118" rx="8" fill="none" stroke="#2e3d5c" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1600" height="1010" fill="url(#bg)"/>

  <!-- header -->
  <text x="40" y="62" font-size="40" font-weight="700" fill="#ffffff">Neural frame generation, <tspan fill="#3aa0ff">built for NVIDIA</tspan></text>
  <text x="40" y="98" font-size="21" fill="#9fb3d1">A network that learned how things move, run by our own CUDA engine inside the streamer</text>

  <!-- 1: trained on real video -->
  <rect x="40" y="124" width="760" height="268" rx="16" fill="url(#card)" stroke="#26324a" stroke-width="2"/>
  <text x="64" y="160" font-size="24" font-weight="700" fill="#ffffff"><tspan fill="#3aa0ff">1</tspan>   It learned from real video</text>
  <g transform="translate(70,180)">
    <use href="#scene"/>
    <circle cx="48" cy="62" r="17" fill="#ffb13b"/>
  </g>
  <g transform="translate(300,180)">
    <use href="#scene"/>
    <circle cx="100" cy="62" r="17" fill="#ffb13b" fill-opacity="0.18" stroke="#ffb13b" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="100" y="69" font-size="20" font-weight="700" fill="#ffb13b" text-anchor="middle">?</text>
  </g>
  <g transform="translate(530,180)">
    <use href="#scene"/>
    <circle cx="152" cy="62" r="17" fill="#ffb13b"/>
  </g>
  <text x="170" y="322" font-size="15" fill="#9fb3d1" text-anchor="middle">frame A</text>
  <text x="400" y="322" font-size="15" fill="#ffb13b" text-anchor="middle">the frame in between: predict it</text>
  <text x="630" y="322" font-size="15" fill="#9fb3d1" text-anchor="middle">frame B</text>
  <text x="64" y="352" font-size="17" fill="#d8e2f1">RIFE was trained on video: shown two frames, predict the one in between, then</text>
  <text x="64" y="376" font-size="17" fill="#d8e2f1">compare it with the real one. It learned how things move, hide and reappear.</text>

  <!-- 2: in the streamer -->
  <rect x="40" y="406" width="760" height="236" rx="16" fill="url(#card)" stroke="#26324a" stroke-width="2"/>
  <text x="64" y="442" font-size="24" font-weight="700" fill="#ffffff"><tspan fill="#3aa0ff">2</tspan>   In the streamer, for every pair of game frames</text>
  <g font-size="14" text-anchor="middle">
    <rect x="60" y="462" width="160" height="114" rx="10" fill="#101a2c" stroke="#2e3d5c" stroke-width="2"/>
    <text x="140" y="500" font-weight="700" fill="#ffffff" font-size="15">Two game frames</text>
    <text x="140" y="524" fill="#9fb3d1">head turns removed</text>
    <text x="140" y="544" fill="#9fb3d1">first, then sized</text>
    <text x="140" y="564" fill="#9fb3d1">to half the eye</text>

    <rect x="246" y="462" width="160" height="114" rx="10" fill="url(#net)" filter="url(#glow)"/>
    <text x="326" y="496" font-weight="700" fill="#ffffff" font-size="16">RIFE 4.4</text>
    <text x="326" y="520" fill="#e8f2ff">motion to each frame</text>
    <text x="326" y="540" fill="#e8f2ff">and a blend mask for</text>
    <text x="326" y="560" fill="#e8f2ff">the moment between</text>

    <rect x="432" y="462" width="160" height="114" rx="10" fill="#101a2c" stroke="#2e3d5c" stroke-width="2"/>
    <text x="512" y="500" font-weight="700" fill="#ffffff" font-size="15">Output pass</text>
    <text x="512" y="524" fill="#9fb3d1">full resolution, one</text>
    <text x="512" y="544" fill="#9fb3d1">sample of each frame,</text>
    <text x="512" y="564" fill="#9fb3d1">still parts kept exact</text>

    <rect x="618" y="462" width="160" height="114" rx="10" fill="#0f2a1f" stroke="#2fbf71" stroke-width="2"/>
    <text x="698" y="500" font-weight="700" fill="#ffffff" font-size="15">Generated frame</text>
    <text x="698" y="524" fill="#a7e8c4">x2: the middle</text>
    <text x="698" y="544" fill="#a7e8c4">x3: a third and</text>
    <text x="698" y="564" fill="#a7e8c4">two thirds</text>
  </g>
  <line x1="222" y1="519" x2="242" y2="519" stroke="#3aa0ff" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="408" y1="519" x2="428" y2="519" stroke="#3aa0ff" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="594" y1="519" x2="614" y2="519" stroke="#3aa0ff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="64" y="614" font-size="17" fill="#d8e2f1">Only the moments the network places best are asked for, and each output is turned to the</text>
  <text x="64" y="636" font-size="17" fill="#d8e2f1" dy="0">newest head pose.</text>

  <!-- 3: why learned motion predicts better -->
  <rect x="40" y="656" width="760" height="206" rx="16" fill="url(#card)" stroke="#26324a" stroke-width="2"/>
  <text x="64" y="692" font-size="24" font-weight="700" fill="#ffffff"><tspan fill="#3aa0ff">3</tspan>   Why learned motion predicts better</text>
  <!-- edge: a ghost where the ball uncovers the pole -->
  <rect x="60" y="710" width="356" height="134" rx="10" fill="#101a2c" stroke="#2e3d5c" stroke-width="2"/>
  <g transform="translate(74,724) scale(0.5)">
    <use href="#scene"/>
    <circle cx="112" cy="62" r="17" fill="#ffb13b" fill-opacity="0.55"/>
    <circle cx="134" cy="62" r="17" fill="#ffb13b" fill-opacity="0.45"/>
  </g>
  <text x="186" y="738" font-size="16" font-weight="700" fill="#ffffff">Optical flow + rules</text>
  <text x="186" y="760" font-size="14" fill="#9fb3d1">edge, the fallback: block motion</text>
  <text x="186" y="780" font-size="14" fill="#9fb3d1">and hand-written rules; where the</text>
  <text x="186" y="800" font-size="14" fill="#9fb3d1">motion is unsure it shows the</text>
  <text x="186" y="820" font-size="14" fill="#9fb3d1">real frame instead of a ghost</text>
  <!-- neural: one clean ball, the pole behind it right -->
  <rect x="428" y="710" width="356" height="134" rx="10" fill="#0d2142" stroke="#3aa0ff" stroke-width="2"/>
  <g transform="translate(442,724) scale(0.5)">
    <use href="#scene"/>
    <circle cx="100" cy="62" r="17" fill="#ffb13b"/>
  </g>
  <text x="554" y="738" font-size="16" font-weight="700" fill="#ffffff">Learned fields</text>
  <text x="554" y="760" font-size="14" fill="#cfe2ff">neural, the default: knows which</text>
  <text x="554" y="780" font-size="14" fill="#cfe2ff">frame to trust where an object</text>
  <text x="554" y="800" font-size="14" fill="#cfe2ff">uncovers the background: fewer</text>
  <text x="554" y="820" font-size="14" fill="#cfe2ff">double images on moving objects</text>

  <!-- 4: the engine -->
  <rect x="820" y="124" width="740" height="738" rx="18" fill="url(#cardBlue)" stroke="#2f8cff" stroke-width="2.5" filter="url(#glow)"/>
  <text x="848" y="166" font-size="28" font-weight="700" fill="#ffffff">A fit-for-purpose CUDA engine</text>
  <text x="848" y="196" font-size="17" fill="#9fc3ff">One network, written for the streamer, instead of a general AI runtime</text>

  <rect x="848" y="220" width="688" height="92" rx="12" fill="#0f2a1f" stroke="#2fbf71" stroke-width="2"/>
  <text x="872" y="256" font-size="18" font-weight="700" fill="#ffffff">Replaced our first backend, TensorRT for RTX</text>
  <text x="872" y="290" font-size="22" font-weight="700" fill="#5fd39a">210 MB  →  11 MB, <tspan fill="#ffffff">the same pictures</tspan> <tspan font-size="16" font-weight="400" fill="#a7e8c4">(within 0.002 dB)</tspan></text>
  <g font-size="16">
    <circle cx="862" cy="352" r="6" fill="#3aa0ff"/>
    <text x="880" y="358" font-weight="700" fill="#ffffff">Hard-coded for RIFE 4.4</text>
    <text x="880" y="382" fill="#c3d4ee">four blocks, coarse to fine (1/8 of the size up to full size);</text>
    <text x="880" y="404" fill="#c3d4ee">compiled ahead for the RTX 30, 40 and 50 series</text>

    <circle cx="862" cy="446" r="6" fill="#3aa0ff"/>
    <text x="880" y="452" font-weight="700" fill="#ffffff">Tensor cores, in half precision</text>
    <text x="880" y="476" fill="#c3d4ee">convolutions from NVIDIA CUTLASS, plus a few kernels of our own</text>

    <circle cx="862" cy="518" r="6" fill="#3aa0ff"/>
    <text x="880" y="524" font-weight="700" fill="#ffffff">Less memory traffic</text>
    <text x="880" y="548" fill="#c3d4ee">the warp is computed where it is read, never stored</text>

    <circle cx="862" cy="590" r="6" fill="#3aa0ff"/>
    <text x="880" y="596" font-weight="700" fill="#ffffff">The frames stay on the GPU</text>
    <text x="880" y="620" fill="#c3d4ee">D3D11 to CUDA and back, on the streamer's own CUDA stream</text>

    <circle cx="862" cy="662" r="6" fill="#3aa0ff"/>
    <text x="880" y="668" font-weight="700" fill="#ffffff">Nothing extra to install</text>
    <text x="880" y="692" fill="#c3d4ee">CUDA comes with the NVIDIA driver: no Python, no TensorRT</text>

    <circle cx="862" cy="734" r="6" fill="#3aa0ff"/>
    <text x="880" y="740" font-weight="700" fill="#ffffff">Small and reproducible</text>
    <text x="880" y="764" fill="#c3d4ee">one 0.7 MB DLL and 10.5 MB of weights, built from pinned</text>
    <text x="880" y="786" fill="#c3d4ee">sources by one script</text>
  </g>
  <text x="848" y="840" font-size="14" fill="#8fa6cc">Needs an RTX 30 series or newer. The setup wizard picks edge when a GPU cannot hold the rate.</text>

  <!-- bottom strip: why NVIDIA-only pays off -->
  <rect x="40" y="878" width="1520" height="112" rx="16" fill="#0b1a14" stroke="#2fbf71" stroke-width="2"/>
  <text x="64" y="912" font-size="20" font-weight="700" fill="#5fd39a">Why NVIDIA-only pays off: everything on one GPU</text>
  <g font-size="15">
    <text x="64" y="946" font-weight="700" fill="#ffffff">NVENC</text>
    <text x="64" y="970" fill="#a7e8c4">hardware encoding, split across every engine</text>
    <text x="436" y="946" font-weight="700" fill="#ffffff">Optical Flow</text>
    <text x="436" y="970" fill="#a7e8c4">the GPU's motion engine (camera turns, edge)</text>
    <text x="820" y="946" font-weight="700" fill="#ffffff">CUDA tensor cores</text>
    <text x="820" y="970" fill="#a7e8c4">the network, in half precision</text>
    <text x="1150" y="946" font-weight="700" fill="#ffffff">D3D11 and CUDA interop</text>
    <text x="1150" y="970" fill="#a7e8c4">the game's frames are never copied to the CPU</text>
  </g>
</svg>
